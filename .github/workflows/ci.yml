name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Unit and eval-set integrity tests
        run: uv run pytest

      - name: Eval regression gate
        run: uv run ccr-eval --gate --no-report

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: |
            docs/scorecard.md
            docs/img/scorecard.svg
