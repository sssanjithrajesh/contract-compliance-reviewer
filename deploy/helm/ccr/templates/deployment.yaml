apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ccr.fullname" . }}-app
  labels: {{- include "ccr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ccr.name" . }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ccr.name" . }}
        app.kubernetes.io/component: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env: {{- include "ccr.env" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
          resources: {{- toYaml .Values.app.resources | nindent 12 }}
---
{{- if .Values.sync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ccr.fullname" . }}-sync
  labels: {{- include "ccr.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ccr.name" . }}
      app.kubernetes.io/component: sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ccr.name" . }}
        app.kubernetes.io/component: sync
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["ccr-sync", "--loop", {{ .Values.sync.intervalSeconds | quote }}]
          env: {{- include "ccr.env" . | nindent 12 }}
          resources: {{- toYaml .Values.sync.resources | nindent 12 }}
{{- end }}
