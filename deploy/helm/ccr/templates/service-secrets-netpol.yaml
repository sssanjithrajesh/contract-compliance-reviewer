apiVersion: v1
kind: Service
metadata:
  name: {{ include "ccr.fullname" . }}
  labels: {{- include "ccr.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "ccr.name" . }}
    app.kubernetes.io/component: app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccr.fullname" . }}-secrets
  labels: {{- include "ccr.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  HUBSPOT_PRIVATE_APP_TOKEN: {{ .Values.secrets.hubspotToken | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.secrets.slackSigningSecret | quote }}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccr.fullname" . }}-db
  labels: {{- include "ccr.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ccr.fullname" . }}-egress
  labels: {{- include "ccr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ccr.name" . }}
  policyTypes: [Egress]
  egress:
    # DNS and the database are always allowed.
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }, { protocol: TCP, port: 5432 }]
    {{- if not .Values.offline }}
    # Online deployments may reach HTTPS (Anthropic, HubSpot, Slack). Offline ones may not.
    - ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ccr.fullname" . }}
  labels: {{- include "ccr.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "ccr.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ccr.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
