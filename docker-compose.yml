# Pilot deployment: app + outbox worker + Postgres.
#
#   cp .env.example .env            # fill in tokens, or leave blank to run without integrations
#   docker compose up --build
#   open http://localhost:8000
#
# Air-gapped:  CCR_OFFLINE=1 docker compose up   (no outbound calls; integrations queue)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ccr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccr-dev-only}
      POSTGRES_DB: ccr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccr -d ccr"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ccr:${POSTGRES_PASSWORD:-ccr-dev-only}@db:5432/ccr
      CCR_CUSTOMER: ${CCR_CUSTOMER:-harlow-pryce}
      CCR_REVIEWER: ${CCR_REVIEWER:-}
      CCR_OFFLINE: ${CCR_OFFLINE:-0}
      CCR_BASE_URL: ${CCR_BASE_URL:-http://localhost:8000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    restart: unless-stopped

  sync:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["ccr-sync", "--loop", "30"]
    environment:
      DATABASE_URL: postgresql+psycopg://ccr:${POSTGRES_PASSWORD:-ccr-dev-only}@db:5432/ccr
      CCR_CUSTOMER: ${CCR_CUSTOMER:-harlow-pryce}
      CCR_OFFLINE: ${CCR_OFFLINE:-0}
      CCR_BASE_URL: ${CCR_BASE_URL:-http://localhost:8000}
      HUBSPOT_PRIVATE_APP_TOKEN: ${HUBSPOT_PRIVATE_APP_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    restart: unless-stopped

volumes:
  pgdata:
