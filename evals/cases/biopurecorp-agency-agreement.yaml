- id: biopurecorp-agency-agreement__insurance
  contract: biopurecorp-agency-agreement
  clause_type: insurance
  question: Is either party required to maintain insurance?
  expected:
    present: true
    spans:
    - start: 18920
      end: 20286
      text: The Company and the Agent will each maintain, at their own expense, insurance with reputable
        insurers, such insurance to be in such form and amounts as are customary in the case of entities
        of established reputation engaged in the same or similar businesses and similarly situated, provided
        that such insurance will in any event include commercial general liability and umbrella liability
        insurance (including product liability coverage) for property damage, bodily injury and personal
        injury in an amount not less than Five Million Dollars ($5,000,000) combined single amount per
        occurrence and in the aggregate. Each such liability insurance policy of the Agent will name the
        Company (as its interest may appear) as an additional insured under the policy and provide for
        at least thirty (30) days prior written notice to the Company of any cancellation, modification
        or amendment of the policy. Each product liability insurance policy of the Company will name the
        Agent (as its interest may appear) as an additional insured under the policy and provide for at
        least thirty (30) days prior written notice to the Agent of any cancellation, modification, or
        amendment of this policy. Each party will furnish to the other upon request a Certificate of Insurance
        or other documentation reasonably satisfactory to the other evidencing compliance with this Paragraph
        3.3.
  source:
    dataset: cuad
    id: BIOPURECORP_06_30_1999-EX-10.13-AGENCY AGREEMENT__Insurance
    license: CC-BY-4.0
  tags:
  - present
  difficulty: medium
