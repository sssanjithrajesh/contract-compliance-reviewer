- id: biopurecorp-agency-agreement__cap_on_liability
  contract: biopurecorp-agency-agreement
  clause_type: cap_on_liability
  question: Is there a cap on either party's liability?
  expected:
    present: true
    spans:
    - start: 21640
      end: 21723
      text: In no       way should the Agent be liable for incidental or consequential damages.
    - start: 16861
      end: 16940
      text: In no event will the Company be liable for incidental or consequential damages.
    - start: 20886
      end: 21639
      text: Subject to Subparagraph (c) below, the Agent will indemnify the       Company (and its officers,
        directors, employees, agents and affiliates)       and hold it (and them) harmless from and against
        all loss, damage,       liability, cost or expense of any nature whatsoever, including, without       limitation,
        any and all reasonable attorneys fees and court costs       (together, a "Loss"), arising out
        of or in connection with (i) the       inaccuracy or breach of any representation, warranty or
        obligation of the       Agent hereunder and/or (ii) the activities of the Agent in connection
        with       the promotion, sale or collection of payment of the Products in violation       of
        this Agreement, law or any other duty or obligation of the Agent.
    - start: 29932
      end: 30084
      text: In no event will either party be       liable for special or consequential damages arising
        out of the breach or       the termination of this Agreement.
    - start: 16629
      end: 16860
      text: The Customer's exclusive remedy for a breach of any of the foregoing warranties will be the
        replacement, at the delivery point thereof, freight prepaid, of any Product furnished hereunder
        that fails to meet the foregoing standards.
  source:
