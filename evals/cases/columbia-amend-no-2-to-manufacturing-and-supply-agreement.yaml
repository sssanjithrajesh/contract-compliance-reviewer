  expected:
    present: true
    spans:
    - start: 22112
      end: 22746
      text: Fleet and Columbia shall maintain comprehensive general liability insurance, including product
        liability insurance against claims regarding the manufacture of Product under this Agreement and
        sufficient cover to meet its liabilities under this Agreement in respect of the Columbia Equipment,
        with insurers having an AM Best rating within the top 2 categories at the time (at the date of
        this Agreement known as "superior" or "excellent") or reasonably comparable coverage, in such
        amounts as it customarily maintains for similar products and activities, but in no event less
        than [***] per individual claim and [***] in the aggregate.
    - start: 22747
      end: 22986
      text: Each party shall maintain such insurance during the Term and thereafter for so long as it
        customarily maintains insurance for itself for similar products and activities (but in no event
        less than [***] following termination or expiration).
