- id: columbia-amend-no-2-to-manufacturing-and-supply-agreement__anti_assignment
  contract: columbia-amend-no-2-to-manufacturing-and-supply-agreement
  clause_type: anti_assignment
  question: Is assignment of the contract restricted?
  expected:
    present: true
    spans:
    - start: 36964
      end: 37755
      text: Neither party shall, without the prior written consent (not to be unreasonably withheld or
        delayed) of the other party having been obtained, assign or transfer this Agreement to any person
        or entity, in whole or in part (and any attempt to do so shall be void), provided that, each party
        may assign or transfer this Agreement without such consent to any Affiliate or to any successor
        by merger of such party, or upon a sale or other transfer of all or substantially all of such
        party's assets or business to which the subject matter of this Agreement pertains, provided that
        the acquirer of the business confirms to the Supplier in writing its agreement to be bound by
        all of the terms and conditions of this Agreement and that the assignor shall remain liable for
        the obligations hereunder.
    - start: 37756
      end: 38159
      text: Notwithstanding the foregoing, it shall not be deemed unreasonable for Columbia to withhold
        consent, to any proposed or attempted assignment (including by merger or sale) by Fleet to a party
        which is not an Affiliate, if Columbia is not reasonably satisfied that the assignee possesses
        the management, finances, personnel, capabilities and facilities to perform fully the obligations
        of Fleet hereunder.
  source:
    dataset: cuad
    id: Columbia Laboratories, (Bermuda) Ltd. - AMEND NO. 2 TO MANUFACTURING AND SUPPLY AGREEMENT__Anti-Assignment
    license: CC-BY-4.0
  tags:
