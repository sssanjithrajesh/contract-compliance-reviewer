- id: columbia-amend-no-2-to-manufacturing-and-supply-agreement__audit_rights
  contract: columbia-amend-no-2-to-manufacturing-and-supply-agreement
  clause_type: audit_rights
  question: Does either party have the right to audit the other?
  expected:
    present: true
    spans:
    - start: 16363
      end: 16609
      text: Columbia or any other person appointed by Columbia shall have the right, in connection with
        any such audit, to inspect and obtain copies of any records or other documents and materials associated
        with or related to the manufacture of the Product.
    - start: 15584
      end: 16233
      text: Columbia QA, any other person appointed by Columbia, Columbia's customer, and/or any Regulatory
        Authority may conduct inspections and audits of Fleet's manufacturing facility, Columbia Equipment,
        quality control laboratories, and other quality systems relating to the manufacture and storage
        of the Product according to Columbia's reasonable procedures upon reasonable prior written notice,
        during normal business hours, provided, however, that Columbia QA, any other person appointed
        by Columbia and/or any Regulatory Authority may conduct a "For Cause" audit during normal business
        hours upon three (3) business days prior written notice to Fleet.
    - start: 16234
      end: 16362
      text: Any such audit undertaken by Columbia QA or any other person appointed by Columbia shall be
        at Columbia's sole cost and expense.
  source:
