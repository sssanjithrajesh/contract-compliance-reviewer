- id: drivendeliveries-consulting-agreement__ip_ownership_assignment
  contract: drivendeliveries-consulting-agreement
  clause_type: ip_ownership_assignment
  question: Does either party assign IP ownership to the other?
  expected:
    present: true
    spans:
    - start: 11086
      end: 11817
      text: Consultant agrees to assist Company, or its designee, at the Company's expense, in every proper
        way to secure the Company's rights in Inventions in any and all countries, including the disclosure
        to the Company of all pertinent information and data with respect thereto, the execution of all
        applications, specifications, oaths, assignments and all other instruments that the Company may
        deem necessary in order to apply for, register, obtain, maintain, defend, and enforce such rights,
        and in order to deliver, assign and convey to the Company, its successors, assigns and nominees
        the sole and exclusive right, title, and interest in and to all Inventions and testifying in a
        suit or other proceeding relating to such Inventions.
    - start: 11976
      end: 12907
      text: Consultant agrees that, if the Company is unable because of Consultant's unavailability, dissolution,
        mental or physical incapacity, or for any other reason, to secure Consultant's signature with
        respect to any Inventions, including, without limitation, for the purpose of applying for or pursuing
        any application for any United States or foreign patents or mask work or copyright registrations
        covering the Inventions assigned to the Company in Section 3.1, then Consultant hereby irrevocably
        designates and appoints the Company and its duly authorized officers and agents as Consultant's
        agent and attorney-in-fact, to act for and on Consultant's behalf to execute and file any papers
        and oaths and to do all other lawfully permitted acts with respect to such Inventions to further
        the prosecution and issuance of patents, copyright and mask work registrations with the same legal
        force and effect as if executed by Consultant. T
    - start: 10461
      end: 11060
      text: Consultant agrees to keep and maintain adequate, current, accurate, and authentic written
        records of all Inventions made by Consultant (solely or jointly with others) during the term of
        this Agreement, and for a period of three (3) years thereafter. The records will be in the form
        of notes, sketches, drawings, electronic files, reports, or any other format that is customary
        in the industry and/or otherwise specified by the Company. Such records are and remain the sole
        property of the Company at all times and upon Company's request, Consultant shall deliver (or
        cause to be delivered) the same.
    - start: 7391
      end: 8416
      text: Consultant agrees that all right, title, and interest in and to any material, notes, records,
        drawings, designs, inventions, improvements, developments, discoveries and trade secrets conceived,
        discovered, authored, invented, developed or reduced to practice by Consultant, solely or in collaboration
        with others, whether or not patentable or copyrightable, during the term of this Agreement and
        arising out of, or in connection with, performing the Services under this Agreement and any copyrights,
        patents, trade secrets, mask work rights or other intellectual property rights relating to the
        foregoing (collectively, "Inventions"), are the sole property of the Company. Consultant also
        agrees to promptly make full written disclosure to the Company of any Inventions and to deliver
        and assign (or cause to be assigned) and irrevocably assigns fully to the Company all right, title
        and interest in and to the Inventions. Without limiting the foregoing, all Inventions shall be
        deemed Confidential Information of the Company
  source:
    dataset: cuad
    id: DRIVENDELIVERIES,INC_05_22_2020-EX-10.4-CONSULTING AGREEMENT__Ip Ownership Assignment
    license: CC-BY-4.0
