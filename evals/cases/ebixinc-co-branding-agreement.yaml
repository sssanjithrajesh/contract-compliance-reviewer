- id: ebixinc-co-branding-agreement__change_of_control
  contract: ebixinc-co-branding-agreement
  clause_type: change_of_control
  question: Does a change of control trigger any rights or obligations?
  expected:
    present: true
    spans:
    - start: 34609
      end: 35764
      text: 'Either party may terminate immediately upon written notice if the other       party (i) ceases
        to function as a going concern or to conduct operations       in the normal course of business;
        (ii) has a petition filed against it       under any state or federal bankruptcy law which petition
        has not been       dismissed or set aside within ninety (90) days of its filing, or if (a)       About
        sells all or substantially all of the assets of such party or any       event or series of event
        whereby any entity acquires beneficial ownership       of the capital stock of such party representing
        fifty percent (50%) of the       voting stock of such party provided however, that the acquisition
        of About       by Primedia shall not be grounds for the termination of this Agreement; or       (b)
        ebix becomes acquired by, merged into or is under the control of any       of the following parties,
        About may terminate this Agreement immediately       upon by providing ebix written notice: AOL;
        Yahoo; Lycos/Terra; NBC; CBS;       Looksmart; InfoSpace; CMGI; AltaVista; Disney; Microsoft;
        CNET;       Excite@Home; AskJeeves; GOTO; Doubleclick; or Lifeminders.'
  source:
    dataset: cuad
    id: EbixInc_20010515_10-Q_EX-10.3_4049767_EX-10.3_Co-Branding Agreement__Change Of Control
    license: CC-BY-4.0
