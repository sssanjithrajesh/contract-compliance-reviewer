  difficulty: medium
- id: hfenterprisesinc-development-agreement__change_of_control
  contract: hfenterprisesinc-development-agreement
  clause_type: change_of_control
  question: Does a change of control trigger any rights or obligations?
  expected:
    present: true
    spans:
    - start: 11866
      end: 12218
      text: The rights of Developer under this Agreement shall immediately cease and be terminated upon
        the sale or transfer of no less than a majority of, or a controlling interest in or over, the
        voting capital or ownership capital of Developer unless an assignment of such rights pursuant
        to such sale or transfer has been previously approved in writing by DSS.
    - start: 11580
      end: 11865
      text: The rights of Developer under this Agreement shall immediately cease and be terminated upon
        the sale or transfer of all or substantially all of the assets of Developer unless an assignment
        of such rights pursuant to such sale or transfer has been previously approved in writing by DSS.
  source:
    dataset: cuad
    id: HfEnterprisesInc_20191223_S-1_EX-10.22_11931299_EX-10.22_Development Agreement__Change Of Control
    license: CC-BY-4.0
  tags:
