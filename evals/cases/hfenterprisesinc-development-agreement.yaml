- id: hfenterprisesinc-development-agreement__termination_for_convenience
  contract: hfenterprisesinc-development-agreement
  clause_type: termination_for_convenience
  question: Can either party terminate without cause, and on what notice?
  expected:
    present: true
    spans:
    - start: 2868
      end: 3544
      text: 'Either party may terminate this Agreement prior to expiration of the Term: (i) upon thirty
        (30) days prior written notice, or (ii) immediately upon written notice to the other party if:
        (a) the other party declares or a petition is filed in any court for insolvency or bankruptcy
        and such petition is not dismissed in thirty (30) days; (b) the other party reorganizes under
        the relevant bankruptcy act or any similar statute in such party''s jurisdiction of incorporation;
        (c) the other party consents to the appointment of a trustee in bankruptcy or a receiver or similar
        entity; or (d) the Developer breaches DSS''s Technology or Intellectual Property rights contained
        herein.'
  source:
    dataset: cuad
    id: HfEnterprisesInc_20191223_S-1_EX-10.22_11931299_EX-10.22_Development Agreement__Termination For
      Convenience
    license: CC-BY-4.0
