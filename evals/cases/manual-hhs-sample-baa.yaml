contract: hhs-sample-baa
title: hhs-sample-baa (manual BAA annotation)
cases:
- id: hhs-sample-baa__baa_permitted_uses
  contract: hhs-sample-baa
  clause_type: baa_permitted_uses
  question: Does the agreement limit how the business associate may use or disclose protected health information?
  expected:
    present: true
    spans:
    - start: 1158
      end: 1312
      text: Business Associate agrees to not use or disclose Protected Health Information other than as
        permitted or required by this Agreement or as required by law.
    - start: 3742
      end: 3925
      text: Business Associate may only use or disclose Protected Health Information as necessary to perform
        the billing and claims processing services set forth in the Master Services Agreement.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_permitted_uses
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: hard
- id: hhs-sample-baa__baa_safeguards
  contract: hhs-sample-baa
  clause_type: baa_safeguards
  question: Must the business associate implement administrative, physical, and technical safeguards?
  expected:
    present: true
    spans:
    - start: 1318
      end: 1623
      text: Business Associate agrees to use appropriate administrative, physical, and technical safeguards,
        and comply with Subpart C of 45 CFR Part 164 with respect to electronic Protected Health Information,
        to prevent use or disclosure of Protected Health Information other than as provided for by this
        Agreement.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_safeguards
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: medium
- id: hhs-sample-baa__baa_breach_notification
  contract: hhs-sample-baa
  clause_type: baa_breach_notification
  question: Must the business associate report breaches or security incidents, and within what time?
  expected:
    present: true
    spans:
    - start: 1629
      end: 2062
      text: Business Associate agrees to report to Covered Entity any use or disclosure of Protected Health
        Information not provided for by this Agreement of which it becomes aware, including breaches of
        unsecured Protected Health Information as required at 45 CFR 164.410, and any security incident
        of which it becomes aware. Such report shall be made without unreasonable delay and in no case
        later than ten (10) business days after discovery.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_breach_notification
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: medium
- id: hhs-sample-baa__baa_subcontractors
  contract: hhs-sample-baa
  clause_type: baa_subcontractors
  question: Must subcontractors agree to the same restrictions in writing?
  expected:
    present: true
    spans:
    - start: 2131
      end: 2434
      text: Business Associate agrees to ensure that any subcontractors that create, receive, maintain,
        or transmit Protected Health Information on behalf of Business Associate agree in writing to the
        same restrictions, conditions, and requirements that apply to Business Associate with respect
        to such information.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_subcontractors
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: medium
- id: hhs-sample-baa__baa_individual_rights
  contract: hhs-sample-baa
  clause_type: baa_individual_rights
  question: Does the business associate have to support access, amendment, and accounting-of-disclosures
    requests?
  expected:
    present: true
    spans:
    - start: 2440
      end: 2680
      text: Business Associate agrees to make available Protected Health Information in a designated record
        set to Covered Entity as necessary to satisfy Covered Entity's obligations under 45 CFR 164.524,
        within fifteen (15) business days of a request.
    - start: 2686
      end: 2865
      text: Business Associate agrees to make any amendment(s) to Protected Health Information in a designated
        record set as directed or agreed to by Covered Entity pursuant to 45 CFR 164.526
    - start: 2970
      end: 3184
      text: Business Associate agrees to maintain and make available the information required to provide
        an accounting of disclosures to Covered Entity as necessary to satisfy Covered Entity's obligations
        under 45 CFR 164.528.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_individual_rights
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: hard
- id: hhs-sample-baa__baa_hhs_access
  contract: hhs-sample-baa
  clause_type: baa_hhs_access
  question: Must the business associate make its practices, books, and records available to HHS?
  expected:
    present: true
    spans:
    - start: 3468
      end: 3679
      text: Business Associate agrees to make its internal practices, books, and records available to
        the Secretary of the Department of Health and Human Services for purposes of determining compliance
        with the HIPAA Rules.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_hhs_access
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: medium
- id: hhs-sample-baa__baa_return_destroy
  contract: hhs-sample-baa
  clause_type: baa_return_destroy
  question: At termination, must PHI be returned or destroyed, and what happens if that is infeasible?
  expected:
    present: true
    spans:
    - start: 7588
      end: 7756
      text: (b) return to Covered Entity or, if agreed to by Covered Entity, destroy the remaining Protected
        Health Information that Business Associate still maintains in any form;
    - start: 8645
      end: 8985
      text: If return or destruction is infeasible, Business Associate shall notify Covered Entity of
        the conditions that make return or destruction infeasible and shall extend the protections of
        this Agreement to such Protected Health Information and limit further uses and disclosures to
        those purposes that make the return or destruction infeasible.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_return_destroy
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: hard
- id: hhs-sample-baa__baa_termination_for_breach
  contract: hhs-sample-baa
  clause_type: baa_termination_for_breach
  question: May the covered entity terminate if the business associate violates a material term?
  expected:
    present: true
    spans:
    - start: 6801
      end: 7101
      text: Business Associate authorizes termination of this Agreement by Covered Entity, if Covered
        Entity determines Business Associate has violated a material term of the Agreement and Business
        Associate has not cured the breach or ended the violation within thirty (30) days of written notice
        of the breach.
  source:
    dataset: manual
    id: hhs-sample-baa:baa_termination_for_breach
    license: public-domain
  tags:
  - present
  - healthcare
  - baa
  difficulty: medium
