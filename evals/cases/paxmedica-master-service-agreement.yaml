- id: paxmedica-master-service-agreement__ip_ownership_assignment
  contract: paxmedica-master-service-agreement
  clause_type: ip_ownership_assignment
  question: Does either party assign IP ownership to the other?
  expected:
    present: true
    spans:
    - start: 9350
      end: 10186
      text: (b) that all deliverables and work products in the form of works of authorship developed by
        CRO in the performance of Services under this Agreement shall be deemed works made for hire, and
        shall belong fully and exclusively to Client; and that if by operation of law such deliverables
        or work products are not works made for hire, CRO agrees to, and does hereby, assign to Client
        all right, title, and interest in such deliverables or work product, including all copyrights
        therein; (c) to execute all necessary documents and provide Client proper assistance (at its expense)
        sufficient to enable it to obtain patent, copyright or other legal protections for any such inventions
        or innovations as described in paragraph 7.1(a) and (b), and to make and maintain reasonably detailed
        accurate records of any such inventions or innovations;
    - start: 8545
      end: 9142
      text: 'CRO agrees that during the term of this Agreement and for a period of three years thereafter:
        (a) to disclose and assign to Client as its exclusive property all inventions and technical or
        business innovations specifically derived from the work assigned by Client to CRO which CRO develops
        or conceives, solely or in conjunction with others (1) that are based on or involve information
        of Client, (2) that relate to, constitute, result from, or include the work in which CRO will
        be engaged for Client, or (3) that are otherwise made through the use of any time, facilities
        or materials of Client;'
  source:
    dataset: cuad
    id: PAXMEDICA,INC_07_02_2020-EX-10.12-Master Service Agreement__Ip Ownership Assignment
    license: CC-BY-4.0
  tags:
  - present
  difficulty: medium
