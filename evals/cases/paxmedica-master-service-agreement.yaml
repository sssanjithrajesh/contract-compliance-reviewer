- id: paxmedica-master-service-agreement__uncapped_liability
  contract: paxmedica-master-service-agreement
  clause_type: uncapped_liability
  question: Are there carve-outs where liability is uncapped?
  expected:
    present: true
    spans:
    - start: 6742
      end: 7256
      text: Notwithstanding any other provision of this Agreement, each party's total liability in respect
        of damages under this Agreement, any regulation or common law shall be limited to the sum of all
        amounts received from Client in terms of this Agreement; provided, however, that this limitation
        shall not apply with respect to any claims arising out of or relating to clause 6 (Inventions
        and Proprietary Information), indemnification obligations or damages arising from a party's gross
        negligence or willful misconduct.
