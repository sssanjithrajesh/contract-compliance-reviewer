- id: teardropgolfco-endorsement-agreement__minimum_commitment
  contract: teardropgolfco-endorsement-agreement
  clause_type: minimum_commitment
  question: Is there a minimum purchase or volume commitment?
  expected:
    present: true
    spans:
    - start: 12844
      end: 13199
      text: TPC agrees to guarantee to Consolidated Artists on behalf of Ogle a minimum Royalty Compensation
        of Twenty Thousand U.S. Dollars ($20,000) payable in four (4) equal installments of Five Thousand
        U.S. Dollars ($5,000) and due simultaneously with the Retainer Fee on or before the first (1st)
        day of February, May, August and November in each Contract Year.
    - start: 15286
      end: 15368
      text: Tour Events and the British Open in each Contract Year during the Contract Period.
    - start: 15011
      end: 15236
      text: TPC shall have the right to prorate the  Retainer Fee due Consolidated Artists upon fourteen
        (14) days written notice  to Consolidated Artists or Advantage in the event Ogle fails to play
        a  minimum of seventeen (17) U.S. PGA
  source:
    dataset: cuad
    id: TEARDROPGOLFCO_10_23_1996-EX-10.12-ENDORSEMENT AGREEMENT__Minimum Commitment
    license: CC-BY-4.0
