      end: 3167
      text: Party A irrevocably undertakes that Party A will take Party B as its exclusive and sole partner
        to provide the business consultancy and technical services as well as technical consultancy to
        Party A and its subsidiaries
    - start: 3169
      end: 3393
      text: Party A shall not establish any same or similar cooperative relationship with any third party
        in respect of such businesses nor shall it make any same or similar arrangement, unless with the
        prior written consent of Party B.
    - start: 3588
      end: 4022
      text: Party A irrevocably undertakes that, without Party B's consent, Party A shall not conduct
        any other business or make any commercial arrangement, including without limitation being engaged
        in or otherwise participating in any commercial activities and businesses independently or together
        with any other person or entity, nor shall it carry out any activities that may be competitive
        with or cause adverse effect to Party B's business.
    - start: 3401
      end: 3580
      text: Party A irrevocably undertakes that it will make best efforts to assist and endeavor to achieve
