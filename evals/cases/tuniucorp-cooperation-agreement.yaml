- id: tuniucorp-cooperation-agreement__ip_ownership_assignment
  contract: tuniucorp-cooperation-agreement
  clause_type: ip_ownership_assignment
  question: Does either party assign IP ownership to the other?
  expected:
    present: true
    spans:
    - start: 14141
      end: 14935
      text: The Parties agree that any and all intellectual property researched and developed, created
        and invented by the Parties (including their employees) in the course of performance of this Agreement
        shall be owned by Party B. For the purpose of this Article 12.3, "Intellectual Property" means
        the patent, patent application right, trademark, service mark, logo, image, trade name, internet
        domain name, design right, copyright (including copyright of computer software) and moral rights,
        database right, right of semiconductor design drawing, utility model, proprietary technology and
        other intellectual property that are registered and unregistered including those that have applied
        for registration, as well as all other rights or protection methods with same or similar effect
        on a global scope.
  source:
