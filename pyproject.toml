[project]
name = "contract-compliance-reviewer"
version = "0.1.0"
description = "Clause-level contract review with citations, refusal, and a human-review queue. Eval-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.2.0",
    "pydantic>=2.7",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
ccr-eval = "evals.run:main"
ccr-build-evals = "scripts.build_eval_set:main"
ccr-serve = "reviewer.app.main:main"
ccr-sync = "reviewer.integrations.sync:main"
ccr-mcp-documents = "reviewer.mcp.documents:main"
ccr-mcp-crm = "reviewer.mcp.crm:main"
ccr-mcp-notify = "reviewer.mcp.notify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer", "evals", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"src/reviewer/app/templates" = "reviewer/app/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/reviewer/app/main.py" = ["B008"]  # FastAPI's Depends() in defaults is the documented idiom
"tests/*" = ["E501"]                   # verbatim contract quotes in tests are long by nature
"scripts/build_baa_evals.py" = ["E501"]  # anchors are exact contract sentences; wrapping would break them
